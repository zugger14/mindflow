name: Deploy MindFlow to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npm run lint

      - name: Build Production Bundle
        run: npm run build

  deploy:
    name: Deploy to EC2 via Docker
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -e
            echo "==> Deploying MindFlow to EC2..."
            
            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="$HOME/mindflow"
            fi
            
            # Initial clone if directory does not exist
            if [ ! -d "$APP_DIR" ]; then
              echo "==> Cloning MindFlow repository..."
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            echo "==> Pulling latest changes from main..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> Launching MindFlow Docker container on port 3020..."
            docker compose down || true
            docker compose up --build -d

            echo "==> Cleaning up dangling images..."
            docker image prune -f

            echo "==> Verifying MindFlow container..."
            docker ps --filter "name=mindflow"
            echo "==> MindFlow successfully deployed!"

  deploy-ecs:
    name: Build, Push to ECR & Restart ECS
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag & Push Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: mindflow
          IMAGE_TAG: latest
        run: |
          echo "==> Building Docker image for MindFlow..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} .
          echo "==> Pushing image to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Restart ECS Service with New Code
        run: |
          echo "==> Checking if ECS service exists and is active..."
          CLUSTER_NAME="multiapp-cluster-production"
          SERVICE_NAME="mindflow-service"
          REGION="${{ secrets.AWS_REGION || 'us-east-1' }}"

          SERVICE_STATUS=$(aws ecs describe-services --cluster "$CLUSTER_NAME" --services "$SERVICE_NAME" --region "$REGION" --query "services[?status=='ACTIVE'].status" --output text 2>/dev/null || true)

          if [ "$SERVICE_STATUS" = "ACTIVE" ]; then
            echo "==> Triggering zero-downtime rolling update on ECS service $SERVICE_NAME..."
            aws ecs update-service \
              --cluster "$CLUSTER_NAME" \
              --service "$SERVICE_NAME" \
              --force-new-deployment \
              --region "$REGION"
            echo "==> ECS deployment successfully triggered!"
          else
            echo "==> Note: ECS service $SERVICE_NAME is not currently active on $CLUSTER_NAME (skipped service restart)."
            echo "==> Image is ready in ECR: ${{ steps.login-ecr.outputs.registry }}/mindflow:latest"
          fi
